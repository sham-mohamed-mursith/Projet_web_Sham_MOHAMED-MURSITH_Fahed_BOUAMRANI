<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Découvrez une collection de personnages emblématiques du jeu vidéo" />
    <title>Galerie de Personnages Légendaires</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script type="module" src="./js/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1><i class="fas fa-gamepad"></i> Galerie de Personnages Légendaires</h1>
      <button id="voir-favoris" class="favoris-btn"><i class="fa-solid fa-star"></i> Voir mes favoris</button>
      <button id="retour-accueil" class="retour-btn"><i class="fa-solid fa-home"></i> Retour Accueil </button>
      <button id="combat-btn" class="retour-btn"><i class="fa-solid fa-bolt"></i> Combat</button>
      <input type="text" id="search-bar" placeholder="Rechercher un personnage..." />
    </header>
    <main id="app"></main>
    <footer>
      <p>© 2025 - Galerie de Personnages Légendaires | Tous droits réservés</p>
      <div class="social-links">
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      </div>
    </footer>
  </body>
</html>
